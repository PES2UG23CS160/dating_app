spring.application.name=unfold
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unfold}
spring.datasource.username=${DB_USER:unfold}
spring.datasource.password=${DB_PASSWORD}
unfold.jwt-secret=${JWT_SECRET}
server.error.include-message=never
server.forward-headers-strategy=framework
unfold.mode=${APP_MODE:demo}
unfold.origin=${APP_ORIGIN:http://localhost:5173}
unfold.secure-cookie=${COOKIE_SECURE:false}
unfold.google-client-id=${GOOGLE_CLIENT_ID:}
unfold.admin-email=${ADMIN_EMAIL:}
unfold.support-email=${SUPPORT_EMAIL:}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.datasource.hikari.maximum-pool-size=5
