services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unfold
      POSTGRES_USER: unfold
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U unfold']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/unfold
      DB_USER: unfold
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_MODE: ${APP_MODE:-demo}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:8080/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - '127.0.0.1:8080:8080'
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:5173:80'
volumes:
  postgres_data:
