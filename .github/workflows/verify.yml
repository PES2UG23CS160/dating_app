name: Verify Unfold
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated test secrets
        run: sh scripts/setup.sh
      - name: Build and start
        run: docker compose up --build --wait --wait-timeout 180 -d
      - name: API integration
        run: python3 scripts/smoke.py
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop test stack
        if: always()
        run: docker compose down -v
